<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta name="description" content="Sistema de gestao para escola de danca Bailado Carioca" />
        <meta name="theme-color" content="#1e293b" />
        <title>Bailado Carioca - Sistema de Gestao</title>
        <link rel="stylesheet" href="/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    </head>
    <body>
        <!-- Welcome/Login Screen -->
        <div id="welcome-screen" class="welcome-screen">
            <div class="welcome-background"></div>
            <div class="welcome-overlay"></div>
            <div class="welcome-container">
                <h1 class="welcome-title">Bem-vindo ao Sistema de Gestao</h1>
                <p class="welcome-subtitle">Bailado Carioca</p>
                <div id="login-form" class="login-form" style="display: none;">
                    <div class="field">
                        <label for="login-usuario">Usuario</label>
                        <input type="text" id="login-usuario" placeholder="Digite seu usuario" autocomplete="username">
                    </div>
                    <div class="field">
                        <label for="login-senha">Senha</label>
                        <input type="password" id="login-senha" placeholder="Digite sua senha" autocomplete="current-password">
                    </div>
                    <div id="login-error" class="login-error" style="display: none;"></div>
                    <button type="button" id="btn-login" class="btn btn-primary btn-full" data-testid="button-login">Entrar</button>
                </div>
                <button type="button" id="btn-entrar" class="btn btn-primary btn-lg" data-testid="button-enter-system">Entrar no Sistema</button>
            </div>
        </div>

        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menu">&#9776;</button>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div id="app" style="display: none;">
            <nav id="sidebar" aria-label="Menu principal">
                <div class="brand" style="text-align: center;">
                    <img src="/logo-original.png" alt="Bailado Carioca" class="sidebar-logo">
                </div>
                <ul id="menu" role="navigation">
                    <!-- Menu items injected by JS -->
                </ul>
                <div id="theme-toggle" role="button" tabindex="0" aria-label="Alternar tema">
                    <span id="theme-icon">[Escuro]</span>
                    <span id="theme-text">Modo Escuro</span>
                </div>
            </nav>

            <main id="main-content">
                <header class="top-bar">
                    <h1 id="page-title">Dashboard</h1>
                    <div class="user-area">
                        <span id="user-name" class="user-profile"></span>
                        <button type="button" id="btn-logout" class="btn btn-sm btn-secondary" data-testid="button-logout">Sair</button>
                    </div>
                </header>

                <section id="content-area" aria-live="polite">
                    <!-- Page content injected by JS -->
                </section>
            </main>
        </div>

        <script type="module" src="/app.js"></script>
    </body>
</html>
