<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta name="description" content="Sistema de gestao para escola de danca Bailado Carioca" />
        <meta name="theme-color" content="#1e293b" />
        <title>Bailado Carioca - Sistema de Gestao</title>
        <link rel="stylesheet" href="/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    </head>
    <body>
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menu">&#9776;</button>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div id="app">
            <nav id="sidebar" aria-label="Menu principal">
                <div class="brand" style="text-align: center;">
                    <img src="/logo.jpg" alt="Bailado Carioca" style="width: 100%; max-width: 180px; height: auto; filter: invert(1);">
                </div>
                <ul id="menu" role="navigation">
                    <!-- Menu items injected by JS -->
                </ul>
                <div id="theme-toggle" role="button" tabindex="0" aria-label="Alternar tema">
                    <span id="theme-icon">[Escuro]</span>
                    <span id="theme-text">Modo Escuro</span>
                </div>
            </nav>

            <main id="main-content">
                <header class="top-bar">
                    <h1 id="page-title">Dashboard</h1>
                    <div class="user-profile">Admin</div>
                </header>

                <section id="content-area" aria-live="polite">
                    <!-- Page content injected by JS -->
                </section>
            </main>
        </div>

        <script type="module" src="/app.js"></script>
    </body>
</html>
