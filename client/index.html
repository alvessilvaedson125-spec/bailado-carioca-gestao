<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bailado Carioca - Sistema de Gestao</title>
        <link rel="stylesheet" href="/style.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    </head>
    <body>
        <div id="app">
            <nav id="sidebar">
                <div class="brand" style="text-align: center; padding: 1.5rem 1rem;">
                    <img src="/logo.jpg" alt="Bailado Carioca" style="width: 100%; max-width: 200px; height: auto; filter: invert(1);">
                </div>
                <ul id="menu">
                    <!-- Menu items injected by JS -->
                </ul>
                <div id="theme-toggle" style="padding: 1rem 1.75rem; border-top: 1px solid rgba(255,255,255,.08); cursor: pointer; color: #94a3b8; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem;">
                    <span id="theme-icon">[Escuro]</span>
                    <span id="theme-text">Modo Escuro</span>
                </div>
            </nav>

            <main id="main-content">
                <header class="top-bar">
                    <h1 id="page-title">Dashboard</h1>
                    <div class="user-profile">Admin</div>
                </header>

                <div id="content-area">
                    <!-- Page content injected by JS -->
                </div>
            </main>
        </div>

        <script type="module" src="/app.js"></script>
    </body>
</html>
